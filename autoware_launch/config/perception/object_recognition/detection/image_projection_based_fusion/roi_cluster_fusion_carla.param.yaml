/**:
  ros__parameters:
    # Fusion parameters for CARLA simulation
    # Maximum distance for fusion (in meters) - matches LiDAR range
    fusion_distance: 100.0

    # Distance threshold for strict IoU matching - extended for far pedestrians
    strict_iou_fusion_distance: 100.0

    # Matching modes: "iou" (full IoU), "iou_x" (only x-axis overlap), "iou_y" (only y-axis overlap)
    strict_iou_match_mode: "iou_x"
    rough_iou_match_mode: "iou_x"

    # Whether to use cluster semantic type from existing classification
    use_cluster_semantic_type: false

    # Only match clusters that are completely inside the ROI
    # Set to false to allow partial matches
    only_allow_inside_cluster: false

    # Scale factor to expand ROI bounding box (1.3 = 30% larger for better far-object matching)
    roi_scale_factor: 1.3

    # IoU threshold for matching clusters with ROIs
    # Lowered for better matching success rate
    iou_threshold: 0.1

    # IoU threshold for unknown class objects (lower threshold = more lenient)
    unknown_iou_threshold: 0.01

    # Remove clusters that remain unknown after fusion
    # Set to false to keep all detected clusters
    remove_unknown: false
