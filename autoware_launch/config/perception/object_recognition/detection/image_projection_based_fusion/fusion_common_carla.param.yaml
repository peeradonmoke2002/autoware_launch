/**:
  ros__parameters:
    # CARLA Simulation Configuration
    # Single camera setup (camera0)

    # Timestamp offset between camera and LiDAR
    # Set to 0 for CARLA since timestamps already match when fusion succeeds
    # The alternating pattern suggests frame synchronization issue, not offset
    # Format: [camera0_offset]
    rois_timestamp_offsets: [0.0]

    # Timeout for waiting for ROIs after LiDAR arrives (in seconds)
    # Increased for CARLA to handle alternating arrival patterns
    rois_timeout_sec: 0.2

    # Timeout for waiting for LiDAR after ROIs arrive (in seconds)
    # Increased to match ROI timing
    msg3d_timeout_sec: 0.1

    # Number of images to buffer
    image_buffer_size: 15

    # Whether to project points to unrectified images (one per camera)
    # CARLA provides rectified images, so set to false
    point_project_to_unrectified_image: [false]

    # Filtering scope for point cloud (in meters)
    # Adjust based on your CARLA map and detection requirements
    filter_scope_min_x: -100.0
    filter_scope_min_y: -100.0
    filter_scope_min_z: -2.0
    filter_scope_max_x: 100.0
    filter_scope_max_y: 100.0
    filter_scope_max_z: 10.0

    # Camera projection approximation (faster processing)
    # Set to true to use cached grid-based projection
    approximate_camera_projection: [true]

    # Grid cell size for approximation (in pixels)
    approximation_grid_cell_width: 1.0
    approximation_grid_cell_height: 1.0

    # Debug parameters
    debug_mode: true
    collector_debug_mode: true
    publish_processing_time_detail: true

    # Whether to publish late messages
    # Set to true to publish output even when some ROIs are missing
    publish_previous_but_late_output_msg: true

    # Rosbag replay length (for rosbag debugging)
    rosbag_length: 10.0

    # Matching strategy for timestamp synchronization
    # Try "advanced" strategy to handle rate mismatch better
    matching_strategy:
      type: advanced
      msg3d_noise_window: 0.05
      rois_timestamp_noise_window: [0.05]

    # Alternative: Use "naive" for simpler timestamp matching
    # matching_strategy:
    #   type: naive
    #   threshold: 0.3
