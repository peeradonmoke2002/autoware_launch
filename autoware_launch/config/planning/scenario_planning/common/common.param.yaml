/**:
  ros__parameters:
    max_vel: 8.33            # max velocity limit [m/s]

    # constraints param for normal driving
    normal:
      min_acc: -2.0         # min deceleration [m/ss]  (-1.0 -> -2.0: comfort braking reference, Notion final setting)
      max_acc: 1.0          # max acceleration [m/ss]
      min_jerk: -1.0        # min jerk [m/sss]
      max_jerk: 1.0         # max jerk [m/sss]

    # constraints to be observed
    limit:
      min_acc: -3.0         # min deceleration limit [m/ss]  (-1.5 -> -3.0: nominal hard-braking threshold, Notion final setting)
      max_acc: 1.0          # max acceleration limit [m/ss]
      min_jerk: -1.0        # min jerk limit [m/sss]  (-1.5 -> -1.0: soften onset of braking)
      max_jerk: 1.5         # max jerk limit [m/sss]
