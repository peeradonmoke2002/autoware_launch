/**:
  ros__parameters:
    trajectory_checker:
      interval:
        enable: true
        threshold: 100.0
      curvature:
        enable: true
        threshold: 1.0
      relative_angle:
        enable: true
        threshold: 2.0 # (= 115 degree)
      lateral_accel:
        enable: true
        threshold: 9.8
      min_lon_accel:
        enable: true
        threshold: -9.8
      max_lon_accel:
        enable: true
        threshold: 9.8
      lateral_jerk:
        enable: true
        threshold: 20.0  # Increased to allow BT avoidance return shift near goal
      steering:
        enable: true
        threshold: 1.414
      steering_rate:
        enable: true
        threshold: 15.0  # Increased from 10.0 to allow BT avoidance maneuvers
      distance_deviation:
        enable: true
        threshold: 100.0
      lon_distance_deviation:
        enable: true
        threshold: 1.0
      velocity_deviation:
        enable: true
        threshold: 100.0
      yaw_deviation:
        enable: true
        threshold: 1.5708 # (= 90 degrees)
        th_trajectory_yaw_shift: 0.1  # [rad] yaw deviation is only checked if the nearest yaw jumped by more than this value between the previous and current trajectory
      forward_trajectory_length:
        enable: true
        acceleration: -3.0
        margin: 2.0
      trajectory_shift:
        enable: true
        lat_shift_th: 3.0  # Increased to 3.0m to accommodate BT avoidance shifts (~2.1m)
        forward_shift_th: 1.0
        backward_shift_th: 0.1
        handling_type: 0  # 0: publish trajectory even if invalid (don't trigger MRM on shift)
        override_error_diag: true  # Don't send error diagnostic for shift validation
